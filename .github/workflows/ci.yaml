name: CI

on:
  push:
    branches:
      - artisanal
      - main
      - master
  pull_request:
    branches:
      - artisanal
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze workspace
        run: flutter analyze

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - pkgs/ultraviolet
          - pkgs/artisanal
          - pkgs/artisanal_widgets
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Get dependencies
        run: flutter pub get

      - name: Precompile remote plugins
        working-directory: pkgs/artisanal
        run: dart run tool/precompile_remote_plugins.dart

      - name: Test ${{ matrix.package }}
        run: |
          if [ "${{ matrix.package }}" = "pkgs/artisanal_widgets" ]; then
            flutter test ${{ matrix.package }} -r compact
          else
            dart test ${{ matrix.package }} -r compact
          fi
