name: CI

on:
  push:
    branches:
      - artisanal
      - main
      - master
  pull_request:
    branches:
      - artisanal
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze workspace
        run: flutter analyze

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        package:
          - pkgs/ultraviolet
          - pkgs/artisanal
          - pkgs/artisanal_test
          - pkgs/artisanal_widgets
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Get dependencies
        run: flutter pub get

      - name: Precompile remote plugins
        working-directory: pkgs/artisanal
        run: dart run tool/precompile_remote_plugins.dart

      - name: Test Dart package ${{ matrix.package }}
        if: matrix.package != 'pkgs/artisanal_widgets' && matrix.package != 'pkgs/artisanal_test' && matrix.os != 'windows-latest'
        run: dart test ${{ matrix.package }} -r compact

      - name: Test PTY harness package
        if: matrix.package == 'pkgs/artisanal_test' && matrix.os != 'windows-latest'
        run: dart test pkgs/artisanal_test/test -r compact

      - name: Test Flutter package ${{ matrix.package }}
        if: matrix.package == 'pkgs/artisanal_widgets' && matrix.os != 'windows-latest'
        run: flutter test ${{ matrix.package }} -r compact

      - name: Test Dart package on Windows ${{ matrix.package }}
        if: matrix.package != 'pkgs/artisanal_widgets' && matrix.package != 'pkgs/artisanal_test' && matrix.os == 'windows-latest'
        run: dart test ${{ matrix.package }} --concurrency=1 -r compact

      - name: Test PTY harness package on Windows
        if: matrix.package == 'pkgs/artisanal_test' && matrix.os == 'windows-latest'
        run: dart test pkgs/artisanal_test/test --concurrency=1 -r compact

      - name: Test Flutter package on Windows ${{ matrix.package }}
        if: matrix.package == 'pkgs/artisanal_widgets' && matrix.os == 'windows-latest'
        run: flutter test ${{ matrix.package }} --concurrency=1 -r compact
