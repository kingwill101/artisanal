version: "3"

vars:
  core_dir: ./pkgs/artisanal
  widgets_dir: ./pkgs/artisanal_widgets
  uv_dir: ./pkgs/ultraviolet

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  analyze:
    desc: Analyze the workspace
    cmds:
      - dart analyze

  test-core:
    desc: Run tests for artisanal core
    dir: "{{.core_dir}}"
    cmds:
      - dart test

  check-shell-completion:
    desc: Compile and validate shell completion for web, native, Bash, and Zsh
    cmds:
      - bash tool/check_shell_completion.sh

  test-widgets:
    desc: Run tests for artisanal widgets
    dir: "{{.widgets_dir}}"
    cmds:
      - dart test

  test-uv:
    desc: Run tests for ultraviolet
    dir: "{{.uv_dir}}"
    cmds:
      - dart test

  benchmark-uv:
    desc: Run the repeatable Ultraviolet AOT performance baseline
    cmds:
      - mkdir -p build/benchmarks
      - dart compile exe pkgs/ultraviolet/benchmark/baseline.dart -o build/benchmarks/uv_baseline
      - build/benchmarks/uv_baseline {{.CLI_ARGS}}

  benchmark-uv-jit:
    desc: Smoke-run the Ultraviolet performance baseline under the JIT
    cmds:
      - dart run pkgs/ultraviolet/benchmark/baseline.dart {{.CLI_ARGS}}

  benchmark-uv-profile:
    desc: Profile named Ultraviolet benchmark regions under the JIT
    cmds:
      - devtools-profiler run --hide-sdk --hide-runtime-helpers --include-package ultraviolet -- dart run pkgs/ultraviolet/benchmark/baseline.dart {{.CLI_ARGS}}

  benchmark-uv-allocations:
    desc: Report Ultraviolet allocation bytes and instances per operation
    cmds:
      - dart run pkgs/ultraviolet/benchmark/allocation_profile.dart {{.CLI_ARGS}}

  run-opencode:
    desc: Run the artisanal_widgets OpenCode example
    cmds:
      - dart run pkgs/artisanal_widgets/example/opencode/main.dart

  run-uv-layout:
    desc: Run the ultraviolet layout example
    cmds:
      - dart run pkgs/ultraviolet/example/layout.dart

  artisanal-demos-build:
    desc: Compile the artisanal examples used by the VHS tapes
    cmds:
      - mkdir -p build/vhs/artisanal
      - dart compile kernel pkgs/artisanal/example/main.dart -o build/vhs/artisanal/main.dill
      - dart compile kernel pkgs/artisanal/example/markdown_demo.dart -o build/vhs/artisanal/markdown_demo.dill
      - dart compile kernel pkgs/artisanal/example/glamour_demo.dart -o build/vhs/artisanal/glamour_demo.dill
      - dart compile kernel pkgs/artisanal/example/spinner_demo.dart -o build/vhs/artisanal/spinner_demo.dill
      - dart compile kernel pkgs/artisanal/example/lipgloss_tui.dart -o build/vhs/artisanal/lipgloss_tui.dill
      - dart compile kernel pkgs/artisanal/example/log_viewer_demo.dart -o build/vhs/artisanal/log_viewer_demo.dill
      - dart compile kernel pkgs/artisanal/example/split_dashboard_demo.dart -o build/vhs/artisanal/split_dashboard_demo.dill
      - dart compile kernel pkgs/artisanal/example/command_center_demo.dart -o build/vhs/artisanal/command_center_demo.dill
      - dart compile kernel pkgs/artisanal/example/data_table_demo.dart -o build/vhs/artisanal/data_table_demo.dill
      - dart compile kernel pkgs/artisanal/example/sequence_diagram_demo.dart -o build/vhs/artisanal/sequence_diagram_demo.dill
      - dart compile kernel pkgs/artisanal/example/widget_catalog.dart -o build/vhs/artisanal/widget_catalog.dill
      - dart compile kernel pkgs/artisanal/example/minimal_cli.dart -o build/vhs/artisanal/minimal_cli.dill

  artisanal-demos:
    desc: Record GIFs for the artisanal examples (requires VHS)
    deps: [artisanal-demos-build]
    cmds:
      - mkdir -p pkgs/artisanal/assets
      - |
        for tape in pkgs/artisanal/example/.vhs/*.tape; do
          vhs "$tape"
        done

  widgets-demos-build:
    desc: Compile the artisanal_widgets examples used by the VHS tapes
    cmds:
      - mkdir -p build/vhs/widgets
      - dart compile kernel pkgs/artisanal_widgets/example/artisanal_app/main.dart -o build/vhs/widgets/artisanal_app.dill
      - dart compile kernel pkgs/artisanal_widgets/example/charting/main.dart -o build/vhs/widgets/charting.dill
      - dart compile kernel pkgs/artisanal_widgets/example/git-diff/main.dart -o build/vhs/widgets/git-diff.dill
      - dart compile kernel pkgs/artisanal_widgets/example/data_table/main.dart -o build/vhs/widgets/data_table.dill
      - dart compile kernel pkgs/artisanal_widgets/example/command_palette/main.dart -o build/vhs/widgets/command_palette.dill
      - dart compile kernel pkgs/artisanal_widgets/example/code-editor/main.dart -o build/vhs/widgets/code-editor.dill
      - dart compile kernel pkgs/artisanal_widgets/example/markdown-editor/main.dart -o build/vhs/widgets/markdown-editor.dill
      - dart compile kernel pkgs/artisanal_widgets/example/dataviz/main.dart -o build/vhs/widgets/dataviz.dill
      - dart compile kernel pkgs/artisanal_widgets/example/debug_console/main.dart -o build/vhs/widgets/debug_console.dill
      - dart compile kernel pkgs/artisanal_widgets/example/opencode/main.dart -o build/vhs/widgets/opencode.dill

  widgets-demos:
    desc: Record GIFs for the artisanal_widgets examples (requires VHS)
    deps: [widgets-demos-build]
    cmds:
      - mkdir -p pkgs/artisanal_widgets/assets
      - |
        for tape in pkgs/artisanal_widgets/example/.vhs/*.tape; do
          vhs "$tape"
        done

  uv-demos-build:
    desc: Compile the ultraviolet examples used by the VHS tapes
    cmds:
      - mkdir -p build/vhs/uv
      - |
        for example in pkgs/ultraviolet/example/*.dart; do
          name="$(basename "$example" .dart)"
          dart compile kernel "$example" -o "build/vhs/uv/$name.dill"
        done

  uv-demos:
    desc: Record GIFs for every ultraviolet example (requires VHS)
    deps: [uv-demos-build]
    cmds:
      - mkdir -p pkgs/ultraviolet/assets
      - |
        for tape in pkgs/ultraviolet/example/.vhs/*.tape; do
          vhs "$tape"
        done
