version: "3"

vars:
  core_dir: ./pkgs/artisanal
  editor_dir: ./apps/artisanal_editor
  widgets_dir: ./pkgs/artisanal_widgets
  uv_dir: ./pkgs/ultraviolet

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  analyze:
    desc: Analyze the workspace
    cmds:
      - dart analyze

  test-core:
    desc: Run tests for artisanal core
    dir: "{{.core_dir}}"
    cmds:
      - dart test

  benchmark-core-editor:
    desc: Measure large-document text-decoration rendering
    cmds:
      - dart run pkgs/artisanal/benchmark/textarea_decoration_benchmark.dart {{.CLI_ARGS}}

  test-editor:
    desc: Run tests for the standalone Artisanal Editor
    dir: "{{.editor_dir}}"
    cmds:
      - dart test

  check-shell-completion:
    desc: Compile and validate shell completion for web, native, Bash, and Zsh
    cmds:
      - bash tool/check_shell_completion.sh

  test-widgets:
    desc: Run tests for artisanal widgets
    dir: "{{.widgets_dir}}"
    cmds:
      - dart test

  test-uv:
    desc: Run tests for ultraviolet
    dir: "{{.uv_dir}}"
    cmds:
      - dart test

  benchmark-uv:
    desc: Run the repeatable Ultraviolet AOT performance baseline
    cmds:
      - mkdir -p build/benchmarks
      - dart compile exe pkgs/ultraviolet/benchmark/baseline.dart -o build/benchmarks/uv_baseline
      - build/benchmarks/uv_baseline {{.CLI_ARGS}}

  benchmark-uv-jit:
    desc: Smoke-run the Ultraviolet performance baseline under the JIT
    cmds:
      - dart run pkgs/ultraviolet/benchmark/baseline.dart {{.CLI_ARGS}}

  benchmark-uv-profile:
    desc: Profile named Ultraviolet benchmark regions under the JIT
    cmds:
      - devtools-profiler run --hide-sdk --hide-runtime-helpers --include-package ultraviolet -- dart run pkgs/ultraviolet/benchmark/baseline.dart {{.CLI_ARGS}}

  benchmark-uv-allocations:
    desc: Report Ultraviolet allocation bytes and instances per operation
    cmds:
      - dart run pkgs/ultraviolet/benchmark/allocation_profile.dart {{.CLI_ARGS}}

  run-opencode:
    desc: Run the OpenCode CLI app
    cmds:
      - dart run apps/opencode/bin/opencode.dart

  run-editor:
    desc: Open the standalone Artisanal Editor in the current workspace
    cmds:
      - dart run artisanal_editor edit --workspace . {{.CLI_ARGS}}

  run-uv-layout:
    desc: Run the ultraviolet layout example
    cmds:
      - dart run pkgs/ultraviolet/example/layout.dart

  artisanal-demos-build:
    desc: Compile the artisanal examples used by the VHS tapes
    cmds:
      - mkdir -p build/vhs/artisanal
      - dart compile kernel pkgs/artisanal/example/main.dart -o build/vhs/artisanal/main.dill
      - dart compile kernel pkgs/artisanal/example/markdown_demo.dart -o build/vhs/artisanal/markdown_demo.dill
      - dart compile kernel pkgs/artisanal/example/glamour_demo.dart -o build/vhs/artisanal/glamour_demo.dill
      - dart compile kernel pkgs/artisanal/example/spinner_demo.dart -o build/vhs/artisanal/spinner_demo.dill
      - dart compile kernel pkgs/artisanal/example/lipgloss_tui.dart -o build/vhs/artisanal/lipgloss_tui.dill
      - dart compile kernel pkgs/artisanal/example/log_viewer_demo.dart -o build/vhs/artisanal/log_viewer_demo.dill
      - dart compile kernel pkgs/artisanal/example/split_dashboard_demo.dart -o build/vhs/artisanal/split_dashboard_demo.dill
      - dart compile kernel pkgs/artisanal/example/command_center_demo.dart -o build/vhs/artisanal/command_center_demo.dill
      - dart compile kernel pkgs/artisanal/example/data_table_demo.dart -o build/vhs/artisanal/data_table_demo.dill
      - dart compile kernel pkgs/artisanal/example/sequence_diagram_demo.dart -o build/vhs/artisanal/sequence_diagram_demo.dill
      - dart compile kernel pkgs/artisanal/example/widget_catalog.dart -o build/vhs/artisanal/widget_catalog.dill
      - dart compile kernel pkgs/artisanal/example/minimal_cli.dart -o build/vhs/artisanal/minimal_cli.dill
      - dart compile kernel pkgs/artisanal/example/lipgloss_table.dart -o build/vhs/artisanal/lipgloss_table.dill
      - dart compile kernel pkgs/artisanal/example/lipgloss_list.dart -o build/vhs/artisanal/lipgloss_list.dill
      - dart compile kernel pkgs/artisanal/example/lipgloss_tree.dart -o build/vhs/artisanal/lipgloss_tree.dill
      - dart compile kernel pkgs/artisanal/example/charting_demo.dart -o build/vhs/artisanal/charting_demo.dill
      - dart compile kernel pkgs/artisanal/example/markdown_showcase.dart -o build/vhs/artisanal/markdown_showcase.dill
      - dart compile kernel pkgs/artisanal/example/theme_integration_demo.dart -o build/vhs/artisanal/theme_integration_demo.dill
      - dart compile kernel pkgs/artisanal/example/compositor_image_demo.dart -o build/vhs/artisanal/compositor_image_demo.dill
      - dart compile kernel pkgs/artisanal/example/editor_core_demo.dart -o build/vhs/artisanal/editor_core_demo.dill
      - dart compile kernel pkgs/artisanal/example/fluent_style_example.dart -o build/vhs/artisanal/fluent_style_example.dill
      - dart compile kernel pkgs/artisanal/example/kitty_image_demo.dart -o build/vhs/artisanal/kitty_image_demo.dill
      - dart compile kernel pkgs/artisanal/example/lipgloss_console_tags.dart -o build/vhs/artisanal/lipgloss_console_tags.dill
      - dart compile kernel pkgs/artisanal/example/lipgloss_layout.dart -o build/vhs/artisanal/lipgloss_layout.dill
      - dart compile kernel pkgs/artisanal/example/render_recorder_demo.dart -o build/vhs/artisanal/render_recorder_demo.dill
      - dart compile kernel pkgs/artisanal/example/scanner_demo.dart -o build/vhs/artisanal/scanner_demo.dill
      - dart compile kernel pkgs/artisanal/example/inline_animation_demo.dart -o build/vhs/artisanal/inline_animation_demo.dill
      - dart compile kernel pkgs/artisanal/example/devtools_demo.dart -o build/vhs/artisanal/devtools_demo.dill
      - dart compile kernel pkgs/artisanal/example/multi_search_demo.dart -o build/vhs/artisanal/multi_search_demo.dill
      - dart compile kernel pkgs/artisanal/example/uv_tui_demo.dart -o build/vhs/artisanal/uv_tui_demo.dill

  artisanal-demos:
    desc: Record GIFs for the artisanal examples (requires VHS)
    deps: [artisanal-demos-build]
    cmds:
      - mkdir -p pkgs/artisanal/assets
      - |
        for tape in pkgs/artisanal/example/.vhs/*.tape; do
          vhs "$tape"
        done

  widgets-demos-build:
    desc: Compile every artisanal_widgets example with a runnable main (dills for the VHS tapes)
    cmds:
      - mkdir -p build/vhs/widgets
      - |
        for main in pkgs/artisanal_widgets/example/*/main.dart; do
          name="$(basename "$(dirname "$main")")"
          dart compile kernel "$main" -o "build/vhs/widgets/$name.dill"
        done

  widgets-demos:
    desc: Record GIFs for the artisanal_widgets examples (requires VHS)
    deps: [widgets-demos-build]
    cmds:
      - mkdir -p pkgs/artisanal_widgets/assets
      - |
        for tape in pkgs/artisanal_widgets/example/.vhs/*.tape; do
          vhs "$tape"
        done

  uv-demos-build:
    desc: Compile the ultraviolet examples used by the VHS tapes
    cmds:
      - mkdir -p build/vhs/uv
      - |
        for example in pkgs/ultraviolet/example/*.dart; do
          name="$(basename "$example" .dart)"
          dart compile kernel "$example" -o "build/vhs/uv/$name.dill"
        done

  tui-demos-build:
    desc: Compile the artisanal tui/examples used by the VHS tapes
    cmds:
      - mkdir -p build/vhs/tui
      - |
        for main in pkgs/artisanal/example/tui/examples/*/main.dart; do
          name="$(basename "$(dirname "$main")")"
          dart compile kernel "$main" -o "build/vhs/tui/$name.dill"
        done

  tui-demos:
    desc: Record GIFs for the artisanal tui/examples (requires VHS)
    deps: [tui-demos-build]
    cmds:
      - |
        for tape in pkgs/artisanal/example/tui/examples/.vhs/*.tape; do
          vhs "$tape"
        done

  uv-demos:
    desc: Record GIFs for every ultraviolet example (requires VHS)
    deps: [uv-demos-build]
    cmds:
      - mkdir -p pkgs/ultraviolet/assets
      - |
        for tape in pkgs/ultraviolet/example/.vhs/*.tape; do
          vhs "$tape"
        done
