name: artisanal
description: A full-stack terminal toolkit for Dart featuring Lip Gloss styling, Bubble Tea TUI architecture, and Ultraviolet rendering.
version: 0.3.1-wip
homepage: https://github.com/kingwill101/artisanal
repository: https://github.com/kingwill101/artisanal
issue_tracker: https://github.com/kingwill101/artisanal/issues
funding:
  - https://www.buymeacoffee.com/kingwill101
topics:
  - cli
  - tui
  - terminal
resolution: workspace

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  ultraviolet: ^0.3.0-wip
  artisanal_widgets: ^0.2.1-wip
  acanthis: ^1.5.1
  args: ^2.7.0
  chalkdart: ^3.0.5
  liquify: ^1.5.1
  hotreloader: ^4.2.0
  meta: ^1.12.0
  path: ^1.9.1
  markdown: ^7.3.0
  petitparser: ^7.0.1
  characters: ^1.4.1
  image: ^4.7.1
  html: ^0.15.5
  highlight: ^0.7.0
  html_unescape: ^2.0.0
  forge2d: ^0.14.2+1
  json_schema_builder: ^0.1.3

dev_dependencies:
  lints: ^6.0.0
  test: ^1.28.0
