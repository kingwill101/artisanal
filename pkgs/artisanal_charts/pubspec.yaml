name: artisanal_charts
description: >
  OpenTUI-style terminal charts for Artisanal — line, bar, pie, scatter,
  area, stacked bar, heatmap, gauge, and sparkline with sub-pixel rendering.
version: 0.1.0
repository: https://github.com/kingwill101/artisanal
issue_tracker: https://github.com/kingwill101/artisanal/issues
funding:
  - https://www.buymeacoffee.com/kingwill101
topics:
  - cli
  - tui
  - terminal
  - charts
resolution: workspace

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  artisanal: ^0.5.0
  artisanal_widgets: ^0.3.0
  meta: ^1.12.0
  ultraviolet: ^0.5.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.28.0
